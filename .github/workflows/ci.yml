# Runs on every push and pull request: fast checks first, then the
# end-to-end suites against a production build and a throwaway database.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: Lint, types, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - name: Build
        run: npm run build
        env:
          # The build doesn't connect to a database; these only satisfy
          # code that reads them while pages are collected.
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          AUTH_SECRET: ci-build-secret-not-used-anywhere-else-0123456789

  e2e:
    name: End-to-end suites
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright-core install --with-deps chromium

      # Starts its own in-memory database and the app (see e2e/run.mjs).
      - run: npm run test:e2e

      - name: Keep logs and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-output
          path: e2e/output
          retention-days: 7
